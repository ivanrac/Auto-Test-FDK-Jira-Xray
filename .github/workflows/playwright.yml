name: FDK Playwright Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

  schedule:
    - cron: '0 5 * * *'

jobs:
  test_and_report:
    timeout-minutes: 60
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        env:
          FDK_LOGIN_USERNAME: ${{ secrets.FDK_LOGIN_USERNAME }}
          FDK_LOGIN_PASSWORD: ${{ secrets.FDK_LOGIN_PASSWORD }}
        run: npx playwright test

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            playwright-results/
            playwright-report/
          if-no-files-found: warn

      - name: Send Failure Notification Email
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.MAIL_SERVER }}
          server_port: ${{ secrets.MAIL_PORT }}
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: ${{ secrets.MAIL_USERNAME }}
          secure: true
          to: ${{ secrets.MAIL_TO }}
          subject: '🚨 Playwright test zlyhal: FDK Login Test'
          body: |
            Ahoj,

            Automatizovaný Playwright test pre FDK zlyhal.

            Typ spustenia: ${{ github.event_name }}

            Skontrolujte logy GitHub Actions:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            GitHub Action: FDK Playwright Tests